services:

  nodered:
    image: nodered/node-red
    container_name: mynodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/node_red_data:/data:rw
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
    privileged: true 
    restart: unless-stopped

networks:
  mqtt5-network:
    external: true
