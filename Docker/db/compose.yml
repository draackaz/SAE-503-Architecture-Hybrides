services:

  mariadb:
    container_name: mariadb
    image: mariadb:latest
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mariadb/data:rw
    environment:
      - MARIADB_ROOT_PASSWORD=mypass
      - MARIADB_DATABASE=MUT
      - MARIADB_USER=mut
      - MARIADB_PASSWORD=mut
    restart: unless-stopped

volumes:
  config:
  data:
  log:

networks:
  mqtt5-network:
    external: true

