# Arcane Docker Compose Configuration
# Generated at 20/11/2026 22:18:38

services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    ports:
      - '3552:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
    environment:
      - ARCANE_APP_URL=http://localhost:3552
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - ARCANE_ENCRYPTION_KEY=63a003c8250841f782e20682e6c17334553698f3baf1f238cab758a7ac2a61b7
    cgroup: host
    healthcheck:
      test: ['CMD', './arcane', 'health', '--timeout', '2s']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  arcane-data:


networks:
  mqtt5-network:
    external: true
