services:

  mariadb:
    container_name: mariadb
    image: mariadb:10.6
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb/data:/var/lib/mariadb/data:rw
    environment:
      - MARIADB_ROOT_PASSWORD=mypass
      - MARIADB_DATABASE=groupe1
      - MARIADB_USER=groupe1
      - MARIADB_PASSWORD=groupe1
    restart: unless-stopped

volumes:
  config:
  data:
  log:

networks:
  mqtt5-network:
    external: true
